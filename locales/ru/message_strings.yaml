admin_user_create_unique_command_reactions: |
  Уникальные реакции на обращение отслеживаемого пользователя к боту.

  Для получения уникальных реакций нажмите кнопку "Включить" внизу данного сообщения.
  Если данный функционал не требуется - нажмите кнопку "Отключить"

