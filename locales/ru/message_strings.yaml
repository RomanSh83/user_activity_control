admin_user_create_id: |
  Введите Telegram ID отслеживаемого пользователя.

admin_user_create_chat_ids: >
  Введите Telegram ID чатов (если чатов несколько, то через разделитель - запятую),
  в которых будет отслеживаться активность создаваемого пользователя.

  Пример ввода:

  <blockquote>1234567890, 2345678901, 345678901</blockquote>

admin_user_update_chat_ids: >
  Активность редактируемого пользователя отслеживается в следующих чатах:
  <blockquote>{chat_ids}</blockquote>
  Если вы хотите изменить перечень чатов, введите Telegram ID всех чатов, в которых необходимо отслуживать активность
  (если чатов несколько, то через разделитель - запятую).

  Пример ввода:

  <blockquote>1234567890, 2345678901, 345678901</blockquote>

  Или нажмите "Пропустить" для перехода к следующему шагу.

admin_user_create_alert_reactions: |
  Реакции на активность отслеживаемого пользователя в чатах.

  Для включения реакций нажмите кнопку "Включить" внизу данного сообщения.
  Если данный функционал не требуется - нажмите кнопку "Отключить".

  Внимание: При отключении реакций на активность пользователя, реакции на отсутствие активности также будут отключены).

admin_user_update_alert_reactions: |
  Реакции на активность отслеживаемого пользователя в чатах: "{alert_reactions}".

  Для изменения данного параметра нажмите соответствующую кнопку ниже данного сообщения
  или нажмите "Пропустить" для перехода к следующему шагу.

  Внимание: При отключении реакций на активность пользователя, реакции на отсутствие активности также будут отключены).

admin_user_create_inactivity_alert_delay: |
  Введите значение временного интервала (мин) между действиями пользователя,
  в течение которого не создаются новые сообщения о тревогах

admin_user_update_inactivity_alert_delay: |
  Текущее значение временного интервала (мин) между действиями пользователя,
  в течение которого не создаются новые сообщения о тревогах - {inactivity_alert_delay} мин.

  Введите новое значение данного временного интервала (мин) или нажмите "Пропустить" для перехода к следующему шагу.

admin_user_create_stand_down_reactions: |
  Реакции на отсутствие активности отслеживаемого пользователя в чатах.

  Для включения реакций нажмите кнопку "Включить" внизу данного сообщения.
  Если данный функционал не требуется - нажмите кнопку "Отключить".

admin_user_update_stand_down_reactions: |
