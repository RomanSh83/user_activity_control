service_bot_stopped: |
  Бот остановлен!

command_chat_about: >
  <b>👮 Вас приветствует CyberControlBot!</b>


  Бот разработан для слежения за активностью механизмов и электронных устройств 🤖,
  представляющихся общественности гуманоидами.


  Для выявления данных субъектов используется уникальный механизм, включающий в себя эвристический анализ поведения,
  одновременно анализирующий около 2 триллионов паттернов поведения участников сообщества и т.д.


  CyberControlBot своевременно оповестит Вас о активности подозрительных субъектов,
  а также может информировать о временном устранении опасности.


  <b>🥷 Будьте начеку! Они среди нас!</b>

command_admin_about: >
  <b>👮 Вас приветствует UserControlBot!</b>


  Бот разработан для слежения за активностью участников сообществ и позволяет:

  - создавать группы (категории) пользователей и словари строк реакций на действия или отсутствие
  действий отслеживаемых пользователей в отслеживаемых чатах;

  - выдавать шуточные ответы на обращение отслеживаемого пользователя командами к боту


  Для начала работы введите команду /start

command_admin_start: >
  <b>👮 Вас приветствует UserControlBot!</b>


  Для просмотра списка категорий отслеживаемых пользователей - нажмите "Список категорий"


  Для добавления новой категории пользователя - нажмите "Создать новую категорию"


  Для просмотра списка отслеживаемых пользователей - нажмите "Список пользователей"


  Для добавления нового пользователя - нажмите "Создать пользователя"

menu_exit: |
  <b>Вы выбрали команду "Выйти из меню"</b>.

  Для возобновления работы с сервисом отправьте команду /start


