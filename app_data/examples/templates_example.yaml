# Образец файла с шаблонами
# Этот файл содержит два шаблона сообщений. Вы можете настроить их как Вам угодно, учитывая следующее:
# 1. Данные в файле должны конвертироваться из yaml файла в словарь, ключами которого являются имена шаблонов
# 2. Имена ключей шаблонов менять нельзя.
# 3. Содержимое шаблонов может быть произвольным, но должно содержать блок для вставки сообщения - {text_body}
# 4. Даже если вы не планируете использовать сообщения об отсутствии активности пользователя,
#    шаблон с именем "stand_down_template" и наличием блока {text_body} внутри должен присутствовать в файле

alarm_template: |
  🚨 <b>Заголовок сообщения</b>

  {text_body}

stand_down_template: |
  😁 <b>Заголовок сообщения</b>

  {text_body}

  <b>Футер/Постскриптум сообщения</b>
